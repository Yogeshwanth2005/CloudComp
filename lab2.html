<!DOCTYPEhtml>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Student registration form</title>
        <style>
            body{
                font-family:Arial,sans-serif;
                background:linear-gradient(to right,#74ebd5,#9face6);
                margin:0;
                padding:30px;
            }
            .container{
                width:600px;
                margin:auto;
                padding:25px;
                border-radius:10px;
                box-shadow:0 0 15px gray;
            }
            h2{
                text-align:center;
                color:#003366
            }
            table{
                width:100%;
            }
            td{
                padding:0px
            }
            input[type=text],
            input[type=email],
            input[type=password],
            input[type=date],
            select,
            textarea{
                width:100%;
                padding:8px;
                border:1px solid gray;
                border-radius:5px;
            }
            textarea{
                resize:none;
            }
            input[type=submit],
            input[type=reset]{
                background:#003366;
                color:white;
                padding:10px 25px;
                border:none;
                border-radius:5px;
                cursor:pointer;
            }
            input[type=submit]:hoover,
            input[type=reset]:hoover{
                background: #06c;
            }
            .footer{
                text-align:center;
                margin-top:20px;
                color:grey
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>Student Registration Form</h2>
            <form>
                <table>
                    <tr>
                        <td>Student Name</td>
                        <td><input type="text" placeholder="Eter Your Name"></td>
                    </tr>
                    <tr>
                        <td>Registered Number</td>
                        <td><input type="text" placeholder="Enter Registered Number"></td>
                    </tr>
                    <tr>
                        <td>Email ID</td>
                        <td><input type="email" placeholder="Enter Email ID"></td>
                    </tr>
                    <tr>
                        <td>Password</td>
                        <td><input type="password" placeholder="Enter Your password"></td>
                    </tr>
                    <tr>
                        <td>Gender</td>
                        <td><input type="radio" placeholder="Enter gender">Male
                            <input type="radio" placeholder="Enter gender">Female
                        </td>
                    </tr>
                    <tr>
                        <td>Date of birth</td>
                        <td><input type="date"></td>
                    </tr>
                    <tr>
                        <td>Age</td>
                        <td><input type="number" min="17" max="30"></td>
                    </tr>
                </table>
            </form>
        </div>
    </body>
</html>
